<body>

  <main class="section">
    <div class="wrap">

      <span class="moodboard-hint">drag · click to read</span>

      <div class="moodboard-outer">
        <div class="moodboard-board" id="mbBoard">
          <span class="board-label">Vol. I — 2026</span>

          <!-- Row 1 -->
          <div class="mb-item" id="mb0" style="left:2%;top:4%;transform:rotate(-3deg);"
            data-num="01." data-title="Culture Froyo, NYC"
            data-desc="To this day the best froyo in NYC — and I dare to say the world. A ritual every time I'm downtown.">
            <span class="mb-num">01.</span>
            <div class="mb-frame"><img src="culture.png" width="250" alt="Culture Froyo"></div>
          </div>

          <div class="mb-item" id="mb1" style="left:20%;top:2%;transform:rotate(2deg);"
            data-num="02." data-title="Ume, Brooklyn"
            data-desc="My best friends took me to this omakase place in Brooklyn. Truly amazing — I'll never forget the amazing selection of salts to season the fresh fish.">
            <span class="mb-num">02.</span>
            <div class="mb-frame"><img src="ume.png" width="300" alt="Ume omakase"></div>
          </div>

          <div class="mb-item" id="mb2" style="left:42%;top:1%;transform:rotate(-2deg);"
            data-num="03." data-title="Meller Sunglasses"
            data-desc="I copied these sunnies from one of my besties and truly they've become a staple in my wardrobe, they go with everything and fit so many face shapes (take it from me a wide faced girly).">
            <span class="mb-num">03.</span>
            <div class="mb-frame"><img src="meller.png" width="200" alt="Meller sunglasses"></div>
          </div>

          <div class="mb-item" id="mb3" style="left:62%;top:3%;transform:rotate(3deg);"
            data-num="04." data-title="Beaded Embroidery"
            data-desc="My new favorite hobby! Something to keep me busy and entertained while I disconnect from screens.">
            <span class="mb-num">04.</span>
            <div class="mb-frame"><img src="embroidery.png" width="200" alt="Embroidery"></div>
          </div>

          <div class="mb-item" id="mb4" style="left:80%;top:2%;transform:rotate(-1.5deg);"
            data-num="05." data-title="Tulips"
            data-desc="Since spring has officially arrived to NYC, I've been loving colorful tulips everywhere — markets, windows, tables. Even just a couple from Trader Joe's in a small vase dresses your living room beautifully.">
            <span class="mb-num">05.</span>
            <div class="mb-frame"><img src="tulips.png" width="200" alt="Tulips"></div>
          </div>

          <!-- Row 2 -->
          <div class="mb-item" id="mb5" style="left:3%;top:50%;transform:rotate(2.5deg);"
            data-num="06." data-title="Manucurist — Hortencia"
            data-desc="The most perfect dusty pink I've ever found. Natural formula, gorgeous finish, and it actually lasts, plus the removal is under a minute. Obsessed.">
            <span class="mb-num">06.</span>
            <div class="mb-frame"><img src="manicurist.png" width="200" alt="Manucurist nail polish"></div>
          </div>

          <div class="mb-item" id="mb6" style="left:21%;top:47%;transform:rotate(-3deg);"
            data-num="07." data-title="Medicube Zero Pore Pads"
            data-desc="A K-beauty holy grail. These exfoliating pads with AHA and BHA have made my skin noticeably smoother in weeks.">
            <span class="mb-num">07.</span>
            <div class="mb-frame"><img src="mediucbe.png" width="250" alt="Medicube pads"></div>
          </div>

          <div class="mb-item" id="mb7" style="left:43%;top:45%;transform:rotate(1.5deg);"
            data-num="08." data-title="Warby Parker Ketty"
            data-desc="My new everyday frames. The burgundy colorway goes with everything and the chunky silhouette feels very right.">
            <span class="mb-num">08.</span>
            <div class="mb-frame"><img src="warby.png" width="200" alt="Warby Parker Ketty glasses"></div>
          </div>

          <div class="mb-item" id="mb8" style="left:63%;top:48%;transform:rotate(-2.5deg);"
            data-num="09." data-title="Casabrews CM5418"
            data-desc="My morning ritual changed entirely with this machine. Proper espresso at home — crema, pressure gauge, the whole thing. My first big girl coffee machine, I recommend it if you're also a first timer when it comes to specialty coffee (+ the price point is unbeatable!)">
            <span class="mb-num">09.</span>
            <div class="mb-frame"><img src="casabrews.png" width="230" alt="Casabrews espresso machine"></div>
          </div>

          <div class="mb-item" id="mb9" style="left:81%;top:50%;transform:rotate(2deg);"
            data-num="10." data-title="Wired Earbuds"
            data-desc="In an era of wireless everything, I keep coming back to wired. No battery anxiety, no lag — and apart from them being on trend, they're actually so much healthier for your body than bluetooth headphones.">
            <span class="mb-num">10.</span>
            <div class="mb-frame"><img src="earbuds.png" width="250" alt="Wired earbuds"></div>
          </div>

        </div>

        <div class="mb-panel" id="mbPanel">
          <button class="mb-panel-close" id="mbClose">✕</button>
          <div class="mb-panel-inner">
            <div class="mb-panel-stamp" id="mbPNum"></div>
            <div class="mb-panel-title" id="mbPTitle"></div>
            <div class="mb-panel-desc" id="mbPDesc"></div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p>© 2026 · Built slowly · Francine Castaing Fratini</p>
    </div>
  </footer>

  <script>
    const board = document.getElementById('mbBoard');
    const panel = document.getElementById('mbPanel');
    const mbClose = document.getElementById('mbClose');
    const mbPNum = document.getElementById('mbPNum');
    const mbPTitle = document.getElementById('mbPTitle');
    const mbPDesc = document.getElementById('mbPDesc');

    const rots = ['-3deg','2deg','-2deg','3deg','-1.5deg','2.5deg','-3deg','1.5deg','-2.5deg','2deg'];
    let dragging = null, ox = 0, oy = 0, didDrag = false, selected = null;

    document.querySelectorAll('.mb-item').forEach((el, idx) => {
      el.addEventListener('mousedown', e => {
        dragging = el;
        didDrag = false;
        const r = el.getBoundingClientRect();
ox = e.clientX - r.left;
oy = e.clientY - r.top;
        el.style.zIndex = 50;
        e.preventDefault();
      });

      el.addEventListener('touchstart', e => {
        const t = e.touches[0];
        dragging = el;
        didDrag = false;
        const r = el.getBoundingClientRect();
        const br = board.getBoundingClientRect();
        ox = t.clientX - (r.left - br.left);
        oy = t.clientY - (r.top - br.top);
        e.preventDefault();
      }, { passive: false });
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      didDrag = true;
      const br = board.getBoundingClientRect();
      let x = Math.max(0, Math.min(br.width - dragging.offsetWidth, e.clientX - br.left - ox));
      let y = Math.max(0, Math.min(br.height - dragging.offsetHeight, e.clientY - br.top - oy));
      dragging.style.left = x + 'px';
      dragging.style.top = y + 'px';
      dragging.style.transform = 'rotate(0deg) scale(1.04)';
    });

    document.addEventListener('touchmove', e => {
      if (!dragging) return;
      didDrag = true;
      const t = e.touches[0];
      const br = board.getBoundingClientRect();
      let x = Math.max(0, Math.min(br.width - dragging.offsetWidth, t.clientX - br.left - ox));
      let y = Math.max(0, Math.min(br.height - dragging.offsetHeight, t.clientY - br.top - oy));
      dragging.style.left = x + 'px';
      dragging.style.top = y + 'px';
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      const idx = [...document.querySelectorAll('.mb-item')].indexOf(dragging);
      dragging.style.transform = `rotate(${rots[idx]})`;
      dragging.style.zIndex = '';
      if (!didDrag) openPanel(dragging);
      dragging = null;
    });

    document.addEventListener('touchend', () => {
      if (!dragging) return;
      const idx = [...document.querySelectorAll('.mb-item')].indexOf(dragging);
      dragging.style.transform = `rotate(${rots[idx]})`;
      if (!didDrag) openPanel(dragging);
      dragging = null;
    });

    function openPanel(el) {
      if (selected) selected.classList.remove('selected');
      selected = el;
      el.classList.add('selected');
      mbPNum.textContent = el.dataset.num;
      mbPTitle.textContent = el.dataset.title;
      mbPDesc.textContent = el.dataset.desc;
      panel.classList.add('open');
    }

    mbClose.addEventListener('click', () => {
      panel.classList.remove('open');
      if (selected) { selected.classList.remove('selected'); selected = null; }
    });
  </script>

</body>
</html>
