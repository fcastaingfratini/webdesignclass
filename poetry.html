    <p>They read to her outside, voices competing with the wind.</p>
    <p class="poem">The words rise and fall<br>with the Patagonian air.<br>She closes her eyes.<br>Somewhere between<br>listening and dreaming.</p>
    <p class="sub">She may have fallen asleep. Just a little.</p>
